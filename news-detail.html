<script src="db.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');

  if (!id) {
    alert('잘못된 접근입니다.');
    window.location.href = 'news.html';
    return;
  }

  const post = await getPostById(id);
  const loading = document.getElementById('loading');
  const card = document.getElementById('detail-card');

  if (!post) {
    loading.innerText = '존재하지 않는 게시글입니다.';
    return;
  }

  loading.classList.add('hidden');
  card.classList.remove('hidden');

  document.title = `${post.title} - G7부동산`;
  document.getElementById('post-category').innerText = post.category || '보도자료';
  document.getElementById('post-date').innerText = post.date || '';
  document.getElementById('post-title').innerText = post.title || '';

  if (post.thumbnail) {
    const thumbContainer = document.getElementById('post-thumb-container');
    const thumbImg = document.getElementById('post-thumb');
    thumbImg.src = post.thumbnail;
    thumbContainer.classList.remove('hidden');
  }

  const contentContainer = document.getElementById('post-content');
  contentContainer.innerHTML = renderMarkdown(post.content || '');

  if (isAdmin()) {
    const adminActions = document.getElementById('admin-actions');
    adminActions.classList.remove('hidden');

    document.getElementById('edit-btn').addEventListener('click', () => {
      window.location.href = `news-write.html?id=${post.id}`;
    });

    document.getElementById('delete-btn').addEventListener('click', async () => {
      if (confirm('정말로 이 게시글을 삭제하시겠습니까?')) {
        await deletePost(post.id);
        alert('삭제되었습니다.');
        window.location.href = 'news.html';
      }
    });
  }
});
</script>
