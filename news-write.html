<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>게시글 작성/수정 - G7부동산</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
try{
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "muted": "#8b95a1",
                    "primary": "#0059b9",
                    "secondary": "#545f6e",
                    "on-surface": "#181c23",
                    "background": "#f9f9ff",
                    "surface": "#f2f4f6"
                }
            }
        }
    }
}catch(_e){}
</script>
</head>
<body class="antialiased min-h-screen flex flex-col font-body-md bg-background text-on-surface pb-24">

<header class="bg-background flex justify-between items-center h-16 px-edge-margin w-full sticky top-0 z-50 shadow-sm border-b border-outline-variant/20">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">location_on</span>
<a href="index.html" class="text-headline-md font-headline-md font-bold text-primary tracking-tight">북항재개발 전문 G7부동산</a>
</div>
<nav class="hidden md:flex items-center gap-lg">
<a href="index.html" class="text-secondary hover:opacity-80">홈</a>
<a href="news.html" class="text-secondary hover:opacity-80">재개발뉴스</a>
<a href="admin.html" class="text-primary font-bold">관리자</a>
</nav>
</header>

<main class="flex-grow w-full max-w-4xl mx-auto px-edge-margin py-xl flex flex-col gap-lg">
<div class="flex justify-between items-center">
<h1 id="form-title" class="text-headline-xl font-bold text-on-surface">게시글 작성</h1>
<a href="admin.html" class="text-body-sm text-secondary hover:underline">취소</a>
</div>

<form id="write-form" class="bg-surface rounded-2xl p-6 md:p-8 border border-outline-variant/30 flex flex-col gap-6 shadow-sm">
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="text-body-sm font-bold text-on-surface">카테고리</label>
<select id="post-category-select" class="px-4 py-2.5 bg-background border border-outline-variant/50 rounded-lg text-body-sm focus:outline-none focus:border-primary">
<option value="보도자료">보도자료</option>
<option value="매물소식">매물소식</option>
<option value="현장스케치">현장스케치</option>
</select>
</div>

<div class="flex flex-col gap-2">
<label class="text-body-sm font-bold text-on-surface">작성일</label>
<input id="post-date-input" type="text" placeholder="2026.03.22" class="px-4 py-2.5 bg-background border border-outline-variant/50 rounded-lg text-body-sm focus:outline-none focus:border-primary"/>
</div>
</div>

<div class="flex flex-col gap-2">
<label class="text-body-sm font-bold text-on-surface">제목</label>
<input id="post-title-input" type="text" required placeholder="제목을 입력하세요" class="px-4 py-2.5 bg-background border border-outline-variant/50 rounded-lg text-body-sm focus:outline-none focus:border-primary"/>
</div>

<div class="flex flex-col gap-2">
<label class="text-body-sm font-bold text-on-surface">썸네일 이미지 URL (선택사항)</label>
<input id="post-thumb-input" type="text" placeholder="https://... 또는 realtor.jpg" class="px-4 py-2.5 bg-background border border-outline-variant/50 rounded-lg text-body-sm focus:outline-none focus:border-primary"/>
</div>

<div class="flex flex-col gap-2">
<label class="text-body-sm font-bold text-on-surface">본문 내용 (마크다운 지원)</label>
<textarea id="post-content-input" rows="12" required placeholder="마크다운 문법으로 본문을 입력하세요..." class="px-4 py-2.5 bg-background border border-outline-variant/50 rounded-lg text-body-sm focus:outline-none focus:border-primary font-mono"></textarea>
</div>

<div class="flex justify-end gap-3 pt-4 border-t border-outline-variant/20">
<a href="admin.html" class="px-6 py-3 bg-surface-variant text-on-surface-variant font-bold rounded-xl text-body-md hover:opacity-80">취소</a>
<button type="submit" id="save-btn" class="px-8 py-3 bg-primary text-white font-bold rounded-xl text-body-md hover:opacity-90 transition-opacity">저장하기</button>
</div>
</form>
</main>

<footer class="w-full px-edge-margin py-xl flex flex-col gap-sm bg-surface-container-low border-t border-outline-variant/30 mt-auto">
<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-md">
<div class="font-bold text-on-surface text-body-md">G7부동산공인중개사사무소</div>
<div class="flex gap-md">
<a class="text-label-sm text-muted hover:text-primary transition-colors" href="index.html">홈</a>
<a class="text-label-sm text-muted hover:text-primary transition-colors" href="news.html">재개발뉴스</a>
</div>
</div>
<p class="text-body-sm text-muted mt-2">© 2026 G7부동산공인중개사사무소. All rights reserved.</p>
</footer>

<script src="db.js"></script>
<script>
let editId = null;

document.addEventListener('DOMContentLoaded', async () => {
  requireAdmin();

  const urlParams = new URLSearchParams(window.location.search);
  editId = urlParams.get('id');

  const today = new Date().toISOString().split('T')[0].replace(/-/g, '.');
  document.getElementById('post-date-input').value = today;

  if (editId) {
    document.getElementById('form-title').innerText = '게시글 수정';
    const post = await getPostById(editId);
    if (post) {
      document.getElementById('post-category-select').value = post.category || '보도자료';
      document.getElementById('post-date-input').value = post.date || today;
      document.getElementById('post-title-input').value = post.title || '';
      document.getElementById('post-thumb-input').value = post.thumbnail || '';
      document.getElementById('post-content-input').value = post.content || '';
    }
  }

  document.getElementById('write-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const saveBtn = document.getElementById('save-btn');
    saveBtn.disabled = true;
    saveBtn.innerText = '저장 중...';

    const postData = {
      id: editId ? Number(editId) : undefined,
      category: document.getElementById('post-category-select').value,
      date: document.getElementById('post-date-input').value.trim() || today,
      title: document.getElementById('post-title-input').value.trim(),
      thumbnail: document.getElementById('post-thumb-input').value.trim(),
      content: document.getElementById('post-content-input').value.trim()
    };

    try {
      const saved = await savePost(postData);
      window.location.href = `news-detail.html?id=${saved.id}`;
    } catch (err) {
      alert('저장 중 오류가 발생했습니다: ' + err.message);
      saveBtn.disabled = false;
      saveBtn.innerText = '저장하기';
    }
  });
});
</script>
</body>
</html>
