<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>관리자 대시보드 - G7부동산</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
try{
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "muted": "#8b95a1",
                    "primary": "#3182f6",
                    "secondary": "#545f6e",
                    "on-surface": "#181c23",
                    "background": "#f9f9ff",
                    "surface": "#f2f4f6"
                }
            }
        }
    }
}catch(_e){}
</script>
</head>
<body class="antialiased min-h-screen flex flex-col font-body-md bg-background text-on-surface">

<header class="bg-background flex justify-between items-center h-16 px-edge-margin w-full sticky top-0 z-50 shadow-sm border-b border-outline-variant/20">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">location_on</span>
<a href="index.html" class="text-headline-md font-headline-md font-bold text-primary tracking-tight">북항재개발 전문 G7부동산</a>
</div>
<nav class="hidden md:flex items-center gap-lg">
<a href="index.html" class="text-secondary hover:opacity-80">홈</a>
<a href="news.html" class="text-secondary hover:opacity-80">재개발뉴스</a>
<a href="admin.html" class="text-primary font-bold">관리자</a>
</nav>
</header>

<main class="flex-grow w-full max-w-5xl mx-auto px-edge-margin py-xl flex flex-col justify-center items-center">

<div id="login-section" class="w-full max-w-md bg-surface rounded-2xl p-8 border border-outline-variant/30 shadow-md">
<div class="flex flex-col items-center gap-2 mb-6">
<span class="material-symbols-outlined text-4xl text-primary">lock</span>
<h1 class="text-headline-lg font-bold text-on-surface">관리자 로그인</h1>
<p class="text-body-sm text-secondary">대시보드에 접근하려면 비밀번호를 입력하세요.</p>
</div>

<form id="login-form" class="flex flex-col gap-4">
<div class="flex flex-col gap-2">
<label class="text-body-sm font-bold text-on-surface">비밀번호</label>
<input id="password-input" type="password" required placeholder="비밀번호 입력" class="px-4 py-3 bg-background border border-outline-variant/50 rounded-xl text-body-md focus:outline-none focus:border-primary"/>
</div>
<div id="error-msg" class="hidden text-red-600 text-body-sm font-semibold"></div>
<button type="submit" class="w-full py-3.5 bg-primary text-white font-bold rounded-xl text-body-md hover:opacity-90 transition-opacity">로그인</button>
</form>
</div>

<div id="dashboard-section" class="hidden w-full flex flex-col gap-6">
<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-outline-variant/30">
<div>
<h1 class="text-headline-xl font-bold text-on-surface">게시글 관리</h1>
<p class="text-body-sm text-secondary">전체 게시글 조회, 수정 및 삭제 관리 대시보드</p>
</div>
<div class="flex gap-3">
<a href="news-write.html" class="px-5 py-2.5 bg-primary text-white font-bold rounded-xl text-body-sm flex items-center gap-1 hover:opacity-90">
<span class="material-symbols-outlined" style="font-size: 18px;">add</span>
<span>새 글 작성</span>
</a>
<button id="logout-btn" class="px-4 py-2.5 bg-surface-variant text-on-surface-variant font-bold rounded-xl text-body-sm hover:opacity-80">
로그아웃
</button>
</div>
</div>

<div class="bg-surface rounded-2xl overflow-hidden border border-outline-variant/30 shadow-sm">
<div class="overflow-x-auto">
<table class="w-full text-left border-collapse">
<thead>
<tr class="bg-surface-container border-b border-outline-variant/30 text-body-sm text-secondary font-bold">
<th class="p-4 w-16 text-center">번호</th>
<th class="p-4 w-28">카테고리</th>
<th class="p-4">제목</th>
<th class="p-4 w-32 text-center">작성일</th>
<th class="p-4 w-36 text-center">관리</th>
</tr>
</thead>
<tbody id="posts-table-body"></tbody>
</table>
</div>
<div id="empty-dashboard-msg" class="hidden text-center py-12 text-muted">
작성된 게시글이 없습니다.
</div>
</div>
</div>
</main>

<footer class="w-full px-edge-margin py-xl flex flex-col gap-sm bg-surface-container-low border-t border-outline-variant/30 mt-auto">
<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-md">
<div class="font-bold text-on-surface text-body-md">북항재개발 전문 G7부동산</div>
<div class="flex gap-md">
<a class="text-label-sm text-muted hover:text-primary transition-colors" href="index.html">홈</a>
<a class="text-label-sm text-muted hover:text-primary transition-colors" href="news.html">재개발뉴스</a>
</div>
</div>
<p class="text-body-sm text-muted mt-2">© 2026 G7부동산공인중개사사무소. All rights reserved.</p>
</footer>

<script src="db.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const loginSection = document.getElementById('login-section');
  const dashboardSection = document.getElementById('dashboard-section');

  if (isAdmin()) {
    loginSection.classList.add('hidden');
    dashboardSection.classList.remove('hidden');
    renderDashboardTable();
  }

  const config = await loadConfig();
  const adminPassword = config.admin_password || 'admin1234';

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const passwordInput = document.getElementById('password-input').value;
    const errorMsg = document.getElementById('error-msg');

    if (passwordInput === adminPassword) {
      sessionStorage.setItem('isAdmin', 'true');
      window.location.reload();
    } else {
      errorMsg.innerText = '비밀번호가 올바르지 않습니다.';
      errorMsg.classList.remove('hidden');
    }
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    sessionStorage.removeItem('isAdmin');
    window.location.reload();
  });
});

async function renderDashboardTable() {
  const posts = await getPosts();
  const tbody = document.getElementById('posts-table-body');
  const emptyMsg = document.getElementById('empty-dashboard-msg');

  if (!posts || posts.length === 0) {
    tbody.innerHTML = '';
    emptyMsg.classList.remove('hidden');
    return;
  }
  emptyMsg.classList.add('hidden');

  tbody.innerHTML = posts.map((post, index) => {
    return `
      <tr class="border-b border-outline-variant/20 hover:bg-background/50 transition-colors">
        <td class="p-4 text-center text-body-sm text-muted">${posts.length - index}</td>
        <td class="p-4"><span class="px-2.5 py-1 bg-weak-background text-primary rounded-md text-label-sm font-bold">${escapeHtml(post.category || '보도자료')}</span></td>
        <td class="p-4"><a href="news-detail.html?id=${post.id}" class="font-bold text-on-surface hover:text-primary transition-colors">${escapeHtml(post.title || '')}</a></td>
        <td class="p-4 text-center text-body-sm text-muted">${escapeHtml(post.date || '')}</td>
        <td class="p-4 text-center">
          <div class="flex justify-center gap-2">
            <a href="news-write.html?id=${post.id}" class="px-2.5 py-1 bg-primary text-white rounded text-label-sm font-bold hover:opacity-90">수정</a>
            <button onclick="handleDelete(${post.id})" class="px-2.5 py-1 bg-red-600 text-white rounded text-label-sm font-bold hover:opacity-90">삭제</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

async function handleDelete(id) {
  if (confirm('정말로 이 게시글을 삭제하시겠습니까?')) {
    await deletePost(id);
    renderDashboardTable();
  }
}
</script>
</body>
</html>
