<script>
let allPosts = [];
let currentCategory = 'all';

document.addEventListener('DOMContentLoaded', async () => {
  allPosts = await getPosts();
  renderPosts();

  document.getElementById('search-input').addEventListener('input', () => {
    renderPosts();
  });

  const catBtns = document.querySelectorAll('.cat-btn');
  catBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      catBtns.forEach(b => {
        b.className = 'cat-btn w-full text-left px-sm py-xs rounded-lg text-secondary hover:bg-surface-variant transition-colors text-body-md whitespace-nowrap';
      });
      btn.className = 'cat-btn w-full text-left px-sm py-xs rounded-lg bg-primary text-on-primary font-bold text-body-md whitespace-nowrap';
      currentCategory = btn.getAttribute('data-cat');
      renderPosts();
    });
  });
});

function renderPosts() {
  const container = document.getElementById('news-list');
  const emptyMsg = document.getElementById('empty-msg');
  const query = document.getElementById('search-input').value.trim().toLowerCase();

  let filtered = allPosts;
  if (currentCategory !== 'all') {
    filtered = filtered.filter(p => p.category === currentCategory);
  }
  if (query) {
    filtered = filtered.filter(p => 
      (p.title && p.title.toLowerCase().includes(query)) ||
      (p.content && p.content.toLowerCase().includes(query))
    );
  }

  if (filtered.length === 0) {
    container.innerHTML = '';
    emptyMsg.classList.remove('hidden');
    return;
  }
  emptyMsg.classList.add('hidden');

  container.innerHTML = filtered.map((post, idx) => {
    const summary = markdownToText(post.content).slice(0, 70) + '...';
    const isFeatured = (idx === 0 && currentCategory === 'all' && !query);
    const colSpan = isFeatured ? 'col-span-1 md:col-span-2 lg:col-span-2' : '';
    const imgHeight = isFeatured ? 'h-64' : 'h-40';

    const thumbHtml = post.thumbnail 
      ? `<img src="${escapeHtml(post.thumbnail)}" alt="${escapeHtml(post.title)}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"/>`
      : `<div class="w-full h-full bg-surface-dim flex items-center justify-center"><span class="material-symbols-outlined text-4xl text-muted">apartment</span></div>`;

    return `
      <article onclick="location.href='news-detail.html?id=${post.id}'" class="${colSpan} bg-surface rounded-xl overflow-hidden group cursor-pointer border border-outline-variant/30 flex flex-col hover:shadow-md transition-all">
        <div class="${imgHeight} w-full relative">
          ${thumbHtml}
          <div class="absolute top-3 left-3">
            <span class="px-3 py-1 bg-primary text-on-primary rounded-full text-label-sm font-bold">${escapeHtml(post.category || '보도자료')}</span>
          </div>
        </div>
        <div class="p-md flex flex-col gap-2 flex-grow">
          <h3 class="text-headline-md font-bold text-on-surface line-clamp-2">${escapeHtml(post.title || '')}</h3>
          <p class="text-body-sm text-secondary line-clamp-2">${escapeHtml(summary)}</p>
          <span class="text-label-sm text-muted mt-auto pt-2">${escapeHtml(post.date || '')}</span>
        </div>
      </article>
    `;
  }).join('');
}
